<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600;700&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet"></helmet>
<div style="width:100%;padding:18px 24px 0;box-sizing:border-box;font-family:'Geist',sans-serif">
<div style="height:64px;padding:0 10px 0 26px;border-radius:999px;background:rgba(255,255,255,.72);border:1px solid #FFFFFF;box-shadow:0 8px 30px rgba(80,60,160,.10);box-sizing:border-box;display:flex;align-items:center;gap:4px;font-size:14px;font-weight:500;color:#1A1726">
<div style="display:flex;align-items:baseline;gap:3px;font-family:'Instrument Serif',serif;font-style:italic;font-size:28px;line-height:1;margin-right:22px">Rientro<span style="width:7px;height:7px;border-radius:50%;background:#6C4DF5;display:inline-block"></span></div>
<sc-for list="{{ items }}" as="it" hint-placeholder-count="4">
<div style="height:42px;padding:0 16px;border-radius:999px;background:{{ it.bg }};color:{{ it.fg }};display:flex;align-items:center;gap:8px;cursor:pointer">{{ it.label }}<sc-if value="{{ it.hasCount }}" hint-placeholder-val="{{ false }}"><span style="min-width:20px;height:20px;padding:0 6px;box-sizing:border-box;border-radius:10px;background:#6C4DF5;color:#FFFFFF;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center">{{ it.count }}</span></sc-if></div>
</sc-for>
<div style="flex:1"></div>
<div style="width:280px;height:44px;border-radius:999px;background:#F1EFF8;display:flex;align-items:center;gap:10px;padding:0 8px 0 16px;box-sizing:border-box;font-size:13px;font-weight:400;color:#8C84AE"><span style="width:11px;height:11px;border:1.8px solid #8C84AE;border-radius:50%"></span>Cerca persone, città, settori<span style="margin-left:auto;font-family:'Geist Mono',monospace;font-size:11px;padding:3px 7px;border-radius:999px;background:#FFFFFF">⌘K</span></div>
<div style="width:44px;height:44px;margin-left:8px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFFFFF,#C9C0F0 45%,#8E7FE0);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#1A1726">AR</div>
</div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:90},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;scopri&quot;,&quot;connessioni&quot;,&quot;messaggi&quot;,&quot;notifiche&quot;,&quot;none&quot;],&quot;default&quot;:&quot;scopri&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? 'scopri';
    const items = [['scopri', 'Scopri persone', 0], ['connessioni', 'Connessioni', 2], ['messaggi', 'Messaggi', 3], ['notifiche', 'Notifiche', 4]].map(([k, label, c]) => ({
      label, count: c, hasCount: !!c, bg: k === a ? '#1A1726' : 'transparent', fg: k === a ? '#FFFFFF' : '#6B6680'
    }));
    return { items };
  }
}
</script>
</body>
</html>
