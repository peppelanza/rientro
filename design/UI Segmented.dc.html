<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600;700&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet"></helmet>
<div style="display:flex;padding:4px;border-radius:999px;background:#F1EFF8;gap:2px;font-family:'Geist',sans-serif;font-size:13px;box-sizing:border-box;width:100%">
<sc-for list="{{ opts }}" as="o" hint-placeholder-count="3">
<span style="flex:1;height:32px;border-radius:999px;background:{{ o.bg }};box-shadow:{{ o.sh }};color:{{ o.fg }};font-weight:{{ o.fw }};display:flex;align-items:center;justify-content:center;white-space:nowrap;padding:0 10px;cursor:pointer">{{ o.label }}</span>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:300,&quot;height&quot;:48},&quot;options&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Ovunque,Italia,Estero&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;active&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Ovunque&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const list = String(this.props.options ?? 'Ovunque,Italia,Estero').split(',').map(s => s.trim());
    const a = this.props.active ?? list[0];
    return { opts: list.map(l => ({ label: l, bg: l === a ? '#FFFFFF' : 'transparent', sh: l === a ? '0 2px 8px rgba(80,60,160,.12)' : 'none', fg: l === a ? '#1A1726' : '#6B6680', fw: l === a ? 600 : 500 })) };
  }
}
</script>
</body>
</html>
