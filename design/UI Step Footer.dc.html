<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600;700&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet"></helmet>
<div style="width:100%;box-sizing:border-box;padding:16px 24px 20px;display:flex;align-items:center;gap:14px;font-family:'Geist',sans-serif">
<dc-import name="UI Button" label="← Indietro" variant="{{ backVariant }}" hint-size="110px,44px"></dc-import>
<div style="flex:1"></div>
<sc-if value="{{ hasStatus }}" hint-placeholder-val="{{ false }}"><span style="font-family:'Geist Mono',monospace;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:{{ statusColor }}">{{ status }}</span></sc-if>
<sc-if value="{{ hasSkip }}" hint-placeholder-val="{{ false }}"><dc-import name="UI Button" label="{{ skip }}" variant="ghost" hint-size="120px,44px"></dc-import></sc-if>
<dc-import name="UI Button" label="{{ primary }}" variant="{{ primaryVariant }}" hint-size="130px,44px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1100,&quot;height&quot;:80},&quot;primary&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Continua&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;status&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;skip&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;disabled&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;accent&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;dark&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;error&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props, dark = p.dark === true || p.dark === 'true', disabled = p.disabled === true || p.disabled === 'true';
    return {
      backVariant: dark ? 'onDark' : 'glass',
      status: p.status, hasStatus: !!p.status, statusColor: p.error ? '#B42318' : (dark ? '#B7B0D4' : '#8C84AE'),
      skip: p.skip, hasSkip: !!p.skip,
      primary: p.primary ?? 'Continua',
      primaryVariant: disabled ? 'secondary' : (p.accent ? 'accent' : (dark ? 'light' : 'primary'))
    };
  }
}
</script>
</body>
</html>
