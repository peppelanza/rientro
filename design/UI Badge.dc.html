<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600;700&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet"></helmet>
<span style="height:28px;padding:0 12px;border-radius:999px;background:{{ bg }};color:{{ fg }};box-sizing:border-box;font-family:'Geist',sans-serif;font-size:12px;font-weight:500;display:inline-flex;align-items:center;gap:7px;white-space:nowrap"><span style="width:7px;height:7px;border-radius:50%;background:{{ dot }};border:{{ ring }};box-sizing:border-box;flex:none"></span>{{ label }}</span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:220,&quot;height&quot;:44},&quot;kind&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;idea&quot;,&quot;explore&quot;,&quot;neutral&quot;,&quot;success&quot;],&quot;default&quot;:&quot;idea&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const V = {
      idea: ['#6C4DF5', '#FFFFFF', '#FFFFFF', 'none', "Ha già un'idea"],
      explore: ['rgba(255,255,255,.92)', '#1A1726', 'transparent', '1.5px solid #6C4DF5', "Cerca un'idea insieme"],
      neutral: ['#F1EFF8', '#4A4560', '#8C84AE', 'none', 'Info'],
      success: ['#E3F5EC', '#1F7A4F', '#2FA36B', 'none', 'Connessi']
    };
    const [bg, fg, dot, ring, def] = V[this.props.kind] || V.idea;
    return { bg, fg, dot, ring, label: this.props.label || def };
  }
}
</script>
</body>
</html>
