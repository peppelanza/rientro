<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600;700&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet"></helmet>
<div style="background:rgba(255,255,255,.55);border:1px solid #FFFFFF;border-radius:28px;padding:18px 10px;display:flex;flex-direction:column;gap:2px;font-family:'Geist',sans-serif;font-size:14px;color:#1A1726">
<sc-if value="{{ hasTitle }}" hint-placeholder-val="{{ true }}"><span style="font-family:'Unbounded',sans-serif;font-size:19px;font-weight:600;letter-spacing:-.04em;padding:0 12px 14px">{{ title }}</span></sc-if>
<sc-if value="{{ hasEyebrow }}" hint-placeholder-val="{{ false }}"><span style="font-family:'Geist Mono',monospace;font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:#6B6680;padding:0 12px 10px">{{ eyebrow }}</span></sc-if>
<sc-for list="{{ items }}" as="it" hint-placeholder-count="6"><span style="padding:10px 14px;border-radius:999px;background:{{ it.bg }};color:{{ it.fg }};font-weight:{{ it.fw }};cursor:pointer">{{ it.l }}</span></sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:240,&quot;height&quot;:380},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Impostazioni&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;eyebrow&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;items&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Account,Privacy,Notifiche,Sicurezza,I tuoi dati,!Elimina account&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;active&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Account&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const list = String(this.props.items ?? 'Account,Privacy,Notifiche,Sicurezza,I tuoi dati,!Elimina account').split(',');
    const a = this.props.active ?? 'Account';
    const items = list.map(raw => { const danger = raw.startsWith('!'); const l = danger ? raw.slice(1) : raw; const on = l === a;
      return { l, bg: on ? '#1A1726' : 'transparent', fg: on ? '#FFFFFF' : danger ? '#B42318' : '#1A1726', fw: on ? 600 : 400 }; });
    return { items, title: this.props.title, hasTitle: !!this.props.title, eyebrow: this.props.eyebrow, hasEyebrow: !!this.props.eyebrow };
  }
}
</script>
</body>
</html>
