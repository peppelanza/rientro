<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600;700&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet"></helmet>
<div style="width:100%;padding:0 12px 22px;box-sizing:border-box;font-family:'Geist',sans-serif">
<div style="border-radius:999px;background:rgba(255,255,255,.82);border:1px solid #FFFFFF;box-shadow:0 10px 30px rgba(80,60,160,.14);padding:6px;display:grid;grid-template-columns:repeat(5,1fr)">
<sc-for list="{{ items }}" as="it" hint-placeholder-count="5">
<div style="min-height:52px;border-radius:999px;background:{{ it.bg }};display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;position:relative">
<div style="width:18px;height:18px;border:1.8px solid {{ it.fg }};border-radius:{{ it.radius }};box-sizing:border-box;background:{{ it.fill }}"></div>
<span style="font-size:10px;color:{{ it.fg }};font-weight:{{ it.fw }}">{{ it.label }}</span>
<sc-if value="{{ it.dot }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;top:7px;left:calc(50% + 6px);width:8px;height:8px;border-radius:50%;background:#6C4DF5;border:2px solid #FFFFFF"></span></sc-if>
</div>
</sc-for>
</div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:90},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;scopri&quot;,&quot;connessioni&quot;,&quot;messaggi&quot;,&quot;notifiche&quot;,&quot;profilo&quot;],&quot;default&quot;:&quot;scopri&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? 'scopri';
    const items = [['scopri', 'Scopri', '50%', 0], ['connessioni', 'Connessioni', '6px', 1], ['messaggi', 'Messaggi', '6px 6px 6px 2px', 1], ['notifiche', 'Notifiche', '50% 50% 4px 4px', 1], ['profilo', 'Profilo', '50%', 0]].map(([k, label, radius, dot]) => ({
      label, radius, dot: !!dot && k !== a,
      bg: k === a ? '#EFEBFF' : 'transparent', fg: k === a ? '#3E2BA8' : '#6B6680', fill: k === a ? '#6C4DF5' : 'transparent', fw: k === a ? 600 : 500
    }));
    return { items };
  }
}
</script>
</body>
</html>
