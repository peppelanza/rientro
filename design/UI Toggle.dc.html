<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600;700&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet"></helmet>
<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:32px;font-family:'Geist',sans-serif;font-size:14px;color:#1A1726;cursor:pointer">
<span>{{ label }}</span>
<span style="width:44px;height:26px;border-radius:13px;background:{{ track }};position:relative;flex:none;transition:background .2s"><span style="position:absolute;top:3px;left:{{ knob }}px;width:20px;height:20px;border-radius:50%;background:#FFFFFF;box-shadow:0 2px 6px rgba(26,23,38,.18)"></span></span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:300,&quot;height&quot;:40},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Opzione&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;on&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const on = this.props.on === true || this.props.on === 'true';
    return { label: this.props.label ?? 'Opzione', track: on ? '#6C4DF5' : '#D9D4EC', knob: on ? 21 : 3 };
  }
}
</script>
</body>
</html>
