<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600;700&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet"></helmet>
<div style="display:inline-flex;align-items:baseline;gap:{{ gap }}px;font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;font-size:{{ fs }}px;line-height:1;letter-spacing:-.01em;color:{{ fg }}">Rientro<span style="width:{{ dot }}px;height:{{ dot }}px;border-radius:50%;background:{{ dc }};display:inline-block"></span></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:200,&quot;height&quot;:60},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:28,&quot;tsType&quot;:&quot;number&quot;},&quot;tone&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;dark&quot;,&quot;light&quot;],&quot;default&quot;:&quot;dark&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const fs = Number(this.props.size ?? 28), light = this.props.tone === 'light';
    return { fs, dot: Math.max(4, Math.round(fs / 4)), gap: Math.max(2, Math.round(fs / 10)), fg: light ? '#FFFFFF' : '#1A1726', dc: light ? '#C9C0F0' : '#6C4DF5' };
  }
}
</script>
</body>
</html>
