<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600;700&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet"></helmet>
<div style="display:flex;align-items:center;gap:10px;min-height:32px;font-family:'Geist',sans-serif;font-size:14px;color:#1A1726;cursor:pointer">
<span style="width:20px;height:20px;border-radius:7px;flex:none;box-sizing:border-box;background:{{ bg }};border:{{ bd }};color:#FFFFFF;font-size:12px;display:flex;align-items:center;justify-content:center">{{ mark }}</span>
<span>{{ label }}</span>
<sc-if value="{{ hasCount }}" hint-placeholder-val="{{ false }}"><span style="margin-left:auto;font-family:'Geist Mono',monospace;font-size:11px;color:#8C84AE">{{ count }}</span></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:260,&quot;height&quot;:40},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Opzione&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;checked&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;count&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const on = this.props.checked === true || this.props.checked === 'true';
    const count = this.props.count;
    return { label: this.props.label ?? 'Opzione', bg: on ? '#6C4DF5' : '#FFFFFF', bd: on ? 'none' : '1.5px solid #CFC8E8', mark: on ? '✓' : '', count, hasCount: count !== undefined && count !== '' };
  }
}
</script>
</body>
</html>
