<!-- Gruppi: list (gruppi.js). Cards as in Connessioni and Scopri. -->
<div style="min-height:100vh;background:#E9E6F5;padding-bottom:40px">
<dc-import name="App Nav" active="gruppi" me="{{ me }}"></dc-import>
<sc-if value="{{ loading }}"><div style="height:60vh"></div></sc-if>
<sc-if value="{{ !loading }}"><main style="max-width:1080px;margin:0 auto;padding:28px var(--gutter) 0;display:flex;flex-direction:column;gap:28px;box-sizing:border-box">
<div style="display:flex;flex-direction:column;gap:8px"><h1 class="r-h2" style="margin:0;font-family:'Unbounded',sans-serif;font-weight:600;font-size:48px;letter-spacing:-.045em;line-height:1">Gruppi</h1><span style="font-size:15px;color:#6B6680;line-height:1.5">Parla con chi torna nella tua stessa regione, o con tutta la community.</span></div>
<sc-for list="{{ sections }}" as="sec"><section aria-label="{{ sec.title }}" style="display:flex;flex-direction:column;gap:12px"><dc-import name="UI Eyebrow" text="{{ sec.title }}"></dc-import>
<div class="groups-grid"><sc-for list="{{ sec.groups }}" as="g"><a href="{{ g.href }}" class="group-card"><span class="group-name">{{ g.name }}</span><span class="group-stats">{{ g.stats }}</span></a></sc-for></div></section></sc-for>
</main></sc-if>
<dc-import name="App TabBar" active="gruppi" me="{{ me }}"></dc-import>
</div>
