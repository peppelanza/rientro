<!-- From design/Rientro 06 Admin v2 · artboard 44a (dashboard). -->
<div class="admin-layout">
<dc-import name="App Admin Sidebar" active="{{ side.active }}" counts="{{ side.counts }}" email="{{ side.email }}"></dc-import>
<main class="admin-main">
<div class="r-stack" style="display:flex;justify-content:space-between;align-items:center;gap:12px"><h1 style="margin:0;font-family:'Unbounded',sans-serif;font-size:26px;font-weight:600;letter-spacing:-.05em">Dashboard</h1><div class="r-stack" style="display:flex;gap:8px;align-items:center"><div style="width:280px;max-width:100%"><dc-import name="App Segmented" label="Periodo" options="{{ periodOpts }}" value="{{ period }}" dc-props="{{ periodProps }}"></dc-import></div><span style="font-family:'Geist Mono',monospace;font-size:12px;color:#6B6680">{{ range }}</span></div></div>
<sc-if value="{{ kpis }}">
<div class="r-grid-2 r-grid-md-2" style="display:grid;grid-template-columns:repeat(6,1fr);gap:8px"><sc-for list="{{ kpis }}" as="k"><dc-import name="UI Stat" label="{{ k.label }}" value="{{ k.value }}" delta="{{ k.delta }}" tone="{{ k.tone }}"></dc-import></sc-for></div>
<div class="r-grid-1 r-grid-md-1" style="display:grid;grid-template-columns:2fr 1fr;gap:12px">
<div style="background:#FFFFFF;border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:14px"><div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap"><span style="font-size:14px;font-weight:600">Iscrizioni nel tempo</span><div style="display:flex;gap:14px;font-size:12px;color:#6B6680"><span style="display:flex;align-items:center;gap:6px"><span style="width:8px;height:8px;border-radius:50%;background:#1A1726"></span>Iscrizioni</span><span style="display:flex;align-items:center;gap:6px"><span style="width:8px;height:8px;border-radius:50%;background:#6C4DF5"></span>Approvati</span></div></div>
<div role="img" aria-label="Grafico delle iscrizioni e approvazioni per giorno" style="height:200px;display:flex;align-items:flex-end;gap:6px;border-bottom:1px solid #ECE8F7"><sc-for list="{{ signups }}" as="s"><div title="{{ s.title }}" style="flex:1;height:100%;display:flex;align-items:flex-end;gap:1px"><div style="flex:1;height:{{ s.a }};background:#1A1726;border-radius:4px 4px 0 0"></div><div style="flex:1;height:{{ s.b }};background:#6C4DF5;border-radius:4px 4px 0 0"></div></div></sc-for></div>
<div style="display:flex;justify-content:space-between;font-family:'Geist Mono',monospace;font-size:10px;color:#8C84AE"><sc-for list="{{ ticks }}" as="t"><span>{{ t.t }}</span></sc-for></div></div>
<div style="background:#FFFFFF;border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:14px"><span style="font-size:14px;font-weight:600">Funnel connessioni</span>
<sc-for list="{{ funnel }}" as="f"><div style="display:flex;flex-direction:column;gap:6px"><div style="display:flex;justify-content:space-between;font-size:13px"><span>{{ f.l }}</span><span style="font-family:'Geist Mono',monospace">{{ f.v }}</span></div><div style="height:10px;border-radius:999px;background:#F1EFF8"><div style="width:{{ f.w }};height:10px;border-radius:999px;background:{{ f.c }}"></div></div></div></sc-for>
</div></div>
<div class="r-grid-1 r-grid-md-2" style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px">
<div style="background:#FFFFFF;border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:12px"><span style="font-size:14px;font-weight:600">Per luogo desiderato</span><sc-for list="{{ cities }}" as="c"><dc-import name="UI Bar Row" label="{{ c.n }}" value="{{ c.v }}" pct="{{ c.w }}" tone="ink"></dc-import></sc-for><sc-if value="{{ noCities }}"><span style="font-size:13px;color:#8C84AE">Ancora nessun dato.</span></sc-if></div>
<div style="background:#FFFFFF;border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:12px"><span style="font-size:14px;font-weight:600">Per settore</span><sc-for list="{{ inds }}" as="c"><dc-import name="UI Bar Row" label="{{ c.n }}" value="{{ c.v }}" pct="{{ c.w }}"></dc-import></sc-for><sc-if value="{{ noInds }}"><span style="font-size:13px;color:#8C84AE">Ancora nessun dato.</span></sc-if></div>
<div style="background:#FFFFFF;border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:14px"><span style="font-size:14px;font-weight:600">Per intento</span>
<div style="display:flex;height:32px;border-radius:999px;overflow:hidden;background:#F1EFF8"><div style="width:{{ ideaW }};background:#6C4DF5"></div><div style="width:{{ seekW }};background:#1A1726"></div></div>
<div style="display:flex;flex-direction:column;gap:8px;font-size:13px"><div style="display:flex;justify-content:space-between"><span style="display:flex;gap:6px;align-items:center"><span style="width:8px;height:8px;border-radius:50%;background:#6C4DF5"></span>Ha già un'idea</span><span style="font-family:'Geist Mono',monospace">{{ ideaPct }}</span></div><div style="display:flex;justify-content:space-between"><span style="display:flex;gap:6px;align-items:center"><span style="width:8px;height:8px;border-radius:50%;background:#1A1726"></span>Cerca un'idea</span><span style="font-family:'Geist Mono',monospace">{{ seekPct }}</span></div></div></div>
</div>
</sc-if>
</main></div>
