<!-- From design/Rientro 06 Admin v2 · artboard 50a (esportazione CSV). -->
<div class="admin-layout">
<dc-import name="App Admin Sidebar" active="{{ side.active }}" counts="{{ side.counts }}" email="{{ side.email }}"></dc-import>
<main class="admin-main">
<sc-if value="{{ datasetOpts }}"><div class="r-grid-1" style="display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:16px;align-content:start">
<div style="display:flex;flex-direction:column;gap:18px">
<h1 style="margin:0;font-family:'Unbounded',sans-serif;font-size:26px;font-weight:600;letter-spacing:-.05em">Nuova esportazione</h1>
<div style="display:flex;flex-direction:column;gap:8px"><span style="font-size:13px;font-weight:500">Dataset</span><div style="width:360px;max-width:100%"><dc-import name="App Segmented" label="Dataset" options="{{ datasetOpts }}" value="{{ dataset }}" dc-props="{{ datasetProps }}"></dc-import></div></div>
<sc-if value="{{ isUsers }}"><div style="display:flex;flex-direction:column;gap:8px"><span style="font-size:13px;font-weight:500">Filtri</span><div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center"><div style="width:220px"><dc-import name="App Select" options="{{ statusOpts }}" value="{{ status }}" placeholder="Stato: tutti" field="exp-status" dc-props="{{ statusProps }}"></dc-import></div></div></div></sc-if>
<div style="display:flex;flex-direction:column;gap:8px"><span style="font-size:13px;font-weight:500">Colonne</span><div class="r-grid-1" style="display:grid;grid-template-columns:repeat(3,1fr);gap:4px 16px;background:#FFFFFF;border-radius:24px;padding:14px 18px"><sc-for list="{{ columns }}" as="c"><dc-import name="UI Checkbox" label="{{ c.l }}" checked="{{ c.on }}" on-click="{{ c.fn }}" host-role="checkbox" host-aria-checked="{{ c.on }}"></dc-import></sc-for></div></div>
<div style="display:flex;gap:10px;align-items:flex-start;padding:14px 18px;border-radius:20px;background:#FFF4DC;font-size:13px;line-height:1.5;color:#7A4E00"><span style="width:7px;height:7px;border-radius:50%;background:#D49A1A;margin-top:6px;flex:none"></span>Contiene dati personali. L'esportazione viene registrata con il tuo nome e l'ora. Non include messaggi privati.</div>
<div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><span style="font-family:'Geist Mono',monospace;font-size:12px;color:#6B6680">{{ summary }}</span><dc-import name="UI Button" label="Genera CSV" variant="accent" on-click="{{ generate }}"></dc-import></div>
</div>
<div style="display:flex;flex-direction:column;gap:10px;padding-top:44px"><dc-import name="UI Eyebrow" text="Recenti"></dc-import>
<div style="background:#FFFFFF;border-radius:24px;padding:4px 16px;display:flex;flex-direction:column;font-size:13px"><sc-if value="{{ noRecent }}"><span style="padding:12px 0;color:#8C84AE">Nessuna esportazione.</span></sc-if><sc-for list="{{ recent }}" as="r"><div style="padding:12px 0;display:flex;flex-direction:column;gap:3px;border-top:{{ r.bt }}"><span style="font-weight:600">{{ r.f }}</span><span style="font-family:'Geist Mono',monospace;font-size:11px;color:#8C84AE">{{ r.m }}</span></div></sc-for></div></div>
</div></sc-if>
</main></div>
