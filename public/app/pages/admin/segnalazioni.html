<!-- From design/Rientro 06 Admin v2 · artboard 48a (segnalazioni). -->
<div class="admin-layout">
<dc-import name="App Admin Sidebar" active="{{ side.active }}" counts="{{ side.counts }}" email="{{ side.email }}"></dc-import>
<main class="admin-main">
<div class="r-stack" style="display:flex;justify-content:space-between;align-items:center;gap:12px"><h1 style="margin:0;font-family:'Unbounded',sans-serif;font-size:26px;font-weight:600;letter-spacing:-.05em">Segnalazioni</h1><sc-if value="{{ tOpen }}"><div role="tablist" style="display:flex;gap:6px"><dc-import name="UI Chip" label="{{ tOpen.l }}" tone="{{ tOpen.tone }}" size="sm" on-click="{{ tOpen.fn }}" host-role="tab" host-aria-selected="{{ tOpen.on }}"></dc-import><dc-import name="UI Chip" label="{{ tClosed.l }}" tone="{{ tClosed.tone }}" size="sm" on-click="{{ tClosed.fn }}" host-role="tab" host-aria-selected="{{ tClosed.on }}"></dc-import></div></sc-if></div>
<sc-if value="{{ reports }}"><div class="admin-table" style="background:#FFFFFF;border-radius:24px">
<div class="admin-row" style="display:grid;grid-template-columns:1.2fr 1.2fr 1.4fr 2fr 90px 280px;gap:14px;padding:12px 18px;border-bottom:1px solid #ECE8F7;background:#F6F4FC;font-family:'Geist Mono',monospace;font-size:10px;letter-spacing:.05em;color:#6B6680;border-radius:24px 24px 0 0"><span>SEGNALATO</span><span>DA</span><span>MOTIVO</span><span>DETTAGLI</span><span>APERTA</span><span></span></div>
<sc-if value="{{ empty }}"><div style="padding:24px 18px;font-size:14px;color:#8C84AE">{{ emptyText }}</div></sc-if>
<sc-for list="{{ reports }}" as="r"><div class="admin-row" style="display:grid;grid-template-columns:1.2fr 1.2fr 1.4fr 2fr 90px 280px;gap:14px;padding:12px 18px;border-bottom:1px solid #ECE8F7;font-size:13px;align-items:center"><button type="button" onClick="{{ r.profile }}" style="border:none;background:none;padding:0;text-align:left;font:600 13px 'Geist',sans-serif;color:#1A1726;cursor:pointer;text-decoration:underline;text-underline-offset:3px">{{ r.who }}</button><span style="color:#6B6680">{{ r.by }}</span><span style="height:26px;justify-self:start;padding:0 10px;border-radius:999px;background:{{ r.rbg }};color:{{ r.rfg }};font-size:12px;font-weight:500;display:flex;align-items:center">{{ r.reason_label }}</span><span style="color:#6B6680;overflow-wrap:anywhere">{{ r.d }}</span><span style="font-family:'Geist Mono',monospace;font-size:12px;color:{{ r.ac }}">{{ r.age }}</span>
<sc-if value="{{ isOpen }}"><div style="display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap"><sc-if value="{{ r.hasChat }}"><dc-import name="UI Button" label="Vedi chat" variant="secondary" size="sm" on-click="{{ r.chat }}"></dc-import></sc-if><dc-import name="UI Button" label="Ignora" variant="ghost" size="sm" on-click="{{ r.dismiss }}"></dc-import><sc-if value="{{ r.isFake }}"><dc-import name="UI Button" label="Richiedi modifiche" variant="secondary" size="sm" on-click="{{ r.changes }}"></dc-import></sc-if><dc-import name="UI Button" label="Sospendi" variant="destructive" size="sm" on-click="{{ r.suspend }}"></dc-import></div></sc-if>
<sc-if value="{{ !isOpen }}"><span style="font-size:12px;color:#6B6680;text-align:right">{{ r.resolution }}</span></sc-if>
</div></sc-for>
</div></sc-if>
</main></div>
