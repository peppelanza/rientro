<!-- Admin · Supporto: the members' tickets, and a ticket's chat (supporto.js) -->
<div class="admin-layout">
<dc-import name="App Admin Sidebar" active="{{ side.active }}" counts="{{ side.counts }}" email="{{ side.email }}" site="{{ side.site }}"></dc-import>
<main class="admin-main">

<sc-if value="{{ isList }}">
<div class="r-stack" style="display:flex;justify-content:space-between;align-items:center;gap:12px"><h1 style="margin:0;font-family:'Unbounded',sans-serif;font-size:26px;font-weight:600;letter-spacing:-.05em">Supporto</h1><div role="tablist" style="display:flex;gap:6px"><dc-import name="UI Chip" label="{{ tOpen.l }}" tone="{{ tOpen.tone }}" size="sm" on-click="{{ tOpen.fn }}" host-role="tab" host-aria-selected="{{ tOpen.on }}"></dc-import><dc-import name="UI Chip" label="{{ tClosed.l }}" tone="{{ tClosed.tone }}" size="sm" on-click="{{ tClosed.fn }}" host-role="tab" host-aria-selected="{{ tClosed.on }}"></dc-import></div></div>
<div style="max-width:420px"><dc-import name="App Field" search="{{ true }}" field="support-q" value="{{ q }}" placeholder="Cerca per codice, oggetto o persona" dc-props="{{ searchProps }}"></dc-import></div>
<div class="support-list">
<sc-if value="{{ empty }}"><p class="support-empty">{{ emptyText }}</p></sc-if>
<sc-for list="{{ tickets }}" as="t"><button type="button" class="support-row" onClick="{{ t.open }}">
<span class="support-code">{{ t.code }}</span>
<span class="support-main"><span class="support-top"><b>{{ t.subject }}</b><span class="support-when">{{ t.when }}</span></span><span class="support-last">{{ t.who }} · {{ t.last }}</span></span>
<span class="support-side"><sc-if value="{{ t.waiting }}"><span class="unread-tag">Da rispondere</span></sc-if></span>
</button></sc-for>
</div>
<dc-import name="App Pager" page="{{ page }}" pages="{{ pages }}" total="{{ total }}" perpage="{{ perPage }}" dc-props="{{ pagerProps }}"></dc-import>
</sc-if>

<sc-if value="{{ isTicket }}">
<a href="/admin/supporto" class="support-back">← Supporto</a>
<section class="support-card support-chat">
<div class="support-chat-head"><span class="support-code">{{ code }}</span><h1>{{ subject }}</h1>
<sc-if value="{{ open }}"><dc-import name="UI Button" label="Chiudi ticket" variant="secondary" size="sm" on-click="{{ close }}"></dc-import></sc-if>
<sc-if value="{{ closed }}"><dc-import name="UI Button" label="Riapri" variant="secondary" size="sm" on-click="{{ reopen }}"></dc-import></sc-if></div>
<p class="support-meta">Da <a href="{{ userHref }}">{{ user }}</a> · {{ email }} · aperto il {{ opened }}</p>
<div class="support-thread"><sc-for list="{{ messages }}" as="m"><div class="support-msg" style="align-items:{{ m.align }}"><span class="support-who">{{ m.who }} · {{ m.at }}</span><sc-if value="{{ m.hasBody }}"><dc-import name="UI Bubble" from="{{ m.from }}" text="{{ m.body }}"></dc-import></sc-if><sc-if value="{{ m.hasImages }}"><div class="{{ m.gridCls }}"><sc-for list="{{ m.images }}" as="im"><a href="{{ im.src }}" target="_blank" rel="noopener"><img src="{{ im.src }}" alt="" loading="lazy"></a></sc-for></div></sc-if></div></sc-for></div>
<sc-if value="{{ closed }}"><p class="support-closed">Il ticket è chiuso: se rispondi resta chiuso, se scrive il membro si riapre.</p></sc-if>
<dc-import name="App Pending Images" dc-props="{{ tray }}"></dc-import>
<div class="support-compose"><dc-import name="App Photo Pick" dc-props="{{ tray }}"></dc-import><dc-import name="App Field" rows="1" grow="8" field="support-team-reply" maxlength="4000" value="{{ draft }}" placeholder="{{ replyHint }}" dc-props="{{ draftProps }}"></dc-import><dc-import name="UI Button" label="Invia" variant="accent" on-click="{{ reply }}"></dc-import></div>
</section>
</sc-if>

</main>
</div>
