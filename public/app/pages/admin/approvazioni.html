<!-- From design/Rientro 06 Admin v2 · artboard 47a (approvazioni · coda + anteprima). -->
<div class="admin-layout">
<dc-import name="App Admin Sidebar" active="{{ side.active }}" counts="{{ side.counts }}" email="{{ side.email }}"></dc-import>
<div class="r-grid-1" style="flex:1;display:grid;grid-template-columns:320px minmax(0,1fr);gap:12px;padding:12px;min-width:0;box-sizing:border-box">
<nav aria-label="Coda approvazioni" style="background:rgba(255,255,255,.55);border:1px solid #FFFFFF;border-radius:24px;padding:18px 8px;display:flex;flex-direction:column;gap:2px;align-self:start">
<div style="padding:0 12px 12px;display:flex;flex-direction:column;gap:6px"><h1 style="margin:0;font-family:'Unbounded',sans-serif;font-size:18px;font-weight:600;letter-spacing:-.035em">Da approvare <span style="font-family:'Geist Mono',monospace;font-size:13px;color:#8C84AE;font-weight:400;letter-spacing:0">{{ count }}</span></h1><span style="font-size:12px;color:#8C84AE">{{ sub }}</span></div>
<sc-if value="{{ empty }}"><span style="padding:12px;font-size:14px;color:#8C84AE">Nessun profilo in attesa. 🎉</span></sc-if>
<sc-for list="{{ queue }}" as="q"><button type="button" onClick="{{ q.open }}" aria-current="{{ q.cur }}" style="display:flex;gap:12px;padding:10px 12px;border:none;border-radius:20px;background:{{ q.bg }};box-shadow:{{ q.sh }};align-items:center;text-align:left;font:inherit;color:#1A1726;cursor:pointer"><dc-import name="App Photo" size="40" src="{{ q.photo_url }}" initials="{{ q.ini }}"></dc-import><div style="display:flex;flex-direction:column;gap:2px;flex:1;min-width:0"><div style="display:flex;justify-content:space-between;gap:8px"><span style="font-size:14px;font-weight:600">{{ q.name }}</span><span style="font-family:'Geist Mono',monospace;font-size:11px;color:{{ q.tc }}">{{ q.wait }}</span></div><span style="font-size:12px;color:#6B6680">{{ q.meta }}</span><sc-if value="{{ q.kindLabel }}"><span style="font-size:11px;color:#6C4DF5">{{ q.kindLabel }}</span></sc-if></div></button></sc-for>
</nav>
<sc-if value="{{ hasSel }}"><section aria-label="Profilo da rivedere" style="background:#FFFFFF;border-radius:24px;display:flex;flex-direction:column;min-width:0;overflow:hidden;align-self:start">
<div style="padding:28px var(--card-pad);display:flex;flex-direction:column;gap:18px" >
<div class="r-stack" style="display:flex;gap:18px"><div style="width:140px;flex:none"><dc-import name="App Photo" ratio="4/5" radius="20px" label="" src="{{ photo }}" alt="{{ name }}"></dc-import></div><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><h2 style="margin:0;font-family:'Unbounded',sans-serif;font-size:26px;font-weight:600;letter-spacing:-.05em"><a href="{{ detailHref }}" style="color:inherit;text-decoration:none">{{ name }}</a></h2><span style="font-size:15px;color:#6B6680">{{ role }}</span><span style="font-size:14px">Vive a {{ from }} <span style="color:#6C4DF5">→</span> {{ to }}</span><div style="display:flex;gap:6px;margin-top:6px;flex-wrap:wrap"><dc-import name="UI Badge" kind="{{ badgeKind }}" label="{{ badgeLabel }}"></dc-import><sc-if value="{{ time }}"><dc-import name="UI Badge" kind="neutral" label="{{ time }}"></dc-import></sc-if></div><span style="font-size:12px;color:#8C84AE;margin-top:4px;overflow-wrap:anywhere">{{ meta }}</span></div></div>
<sc-if value="{{ isChanges }}"><div style="padding:12px 16px;border-radius:18px;background:#FFF4DC;font-size:14px;color:#7A4E00">Profilo già online. Da rivedere solo le modifiche a: <b style="font-weight:600">{{ pendingKeys }}</b></div></sc-if>
<div class="r-grid-2" style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px"><sc-for list="{{ checks }}" as="c"><div style="padding:12px 14px;border-radius:18px;background:{{ c.bg }};font-size:12px;color:{{ c.fg }};display:flex;flex-direction:column;gap:2px"><b style="font-weight:600">{{ c.t }}</b>{{ c.d }}</div></sc-for></div>
<div class="r-grid-1" style="display:grid;grid-template-columns:170px 1fr;gap:12px 20px;font-size:14px;line-height:1.5"><sc-for list="{{ answers }}" as="a"><dc-import name="UI Eyebrow" text="{{ a.k }}"></dc-import><span style="white-space:pre-line;overflow-wrap:anywhere">{{ a.v }}</span></sc-for></div>
</div>
<div style="padding:16px 20px;display:flex;flex-direction:column;gap:12px;background:#F6F4FC">
<dc-import name="App Field" rows="2" field="review-note" value="{{ note }}" placeholder="Nota per l'utente (obbligatoria se richiedi modifiche o rifiuti)" dc-props="{{ noteProps }}"></dc-import>
<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="r-hide-sm" style="font-size:12px;color:#8C84AE">Nota inviata all'utente se richiedi modifiche o rifiuti</span><div style="flex:1"></div><dc-import name="UI Button" label="Sospendi" variant="ghost" size="sm" on-click="{{ suspend }}"></dc-import><sc-if value="{{ canReject }}"><dc-import name="UI Button" label="Rifiuta" variant="light" size="sm" on-click="{{ reject }}"></dc-import></sc-if><dc-import name="UI Button" label="Richiedi modifiche" variant="secondary" size="sm" on-click="{{ changes }}"></dc-import><dc-import name="UI Button" label="Approva · A" variant="accent" size="sm" on-click="{{ approve }}" host-aria-keyshortcuts="A"></dc-import></div>
</div></section></sc-if>
</div></div>
