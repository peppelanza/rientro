<!-- From design/Rientro 06 Admin v2 · artboard 46a (dettaglio utente). -->
<div class="admin-layout">
<dc-import name="App Admin Sidebar" active="{{ side.active }}" counts="{{ side.counts }}" email="{{ side.email }}" site="{{ side.site }}"></dc-import>
<main class="admin-main">
<sc-if value="{{ rows }}">
<div class="r-grid-1 r-grid-md-1" style="display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-content:start">
<div style="display:flex;flex-direction:column;gap:16px;min-width:0">
<a href="/admin/utenti" style="font-size:13px;color:#6B6680;text-decoration:none">← Utenti</a>
<div style="display:flex;gap:18px;align-items:center"><dc-import name="App Photo" size="80" src="{{ photo }}" initials="{{ ini }}"></dc-import><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><h1 style="margin:0;font-family:'Unbounded',sans-serif;font-size:24px;font-weight:600;letter-spacing:-.045em">{{ name }}</h1><dc-import name="UI Badge" kind="{{ kind }}" label="{{ statusLabel }}"></dc-import></div><span style="font-size:14px;color:#6B6680;overflow-wrap:anywhere">{{ sub }}</span></div></div>
<sc-if value="{{ pending }}"><div style="display:flex;gap:12px;align-items:center;padding:12px 16px;border-radius:18px;background:#FFF4DC;font-size:14px;color:#7A4E00"><span style="width:7px;height:7px;border-radius:50%;background:#D49A1A;flex:none"></span>{{ pendingText }}</div></sc-if>
<div role="tablist" style="display:flex;gap:6px;flex-wrap:wrap"><dc-import name="UI Chip" label="Profilo" tone="{{ tProfilo.tone }}" size="sm" on-click="{{ tProfilo.fn }}" host-role="tab" host-aria-selected="{{ tProfilo.on }}"></dc-import><dc-import name="UI Chip" label="Consensi e scelte" tone="{{ tAttivita.tone }}" size="sm" on-click="{{ tAttivita.fn }}" host-role="tab" host-aria-selected="{{ tAttivita.on }}"></dc-import><dc-import name="UI Chip" label="{{ tSegn.l }}" tone="{{ tSegn.tone }}" size="sm" on-click="{{ tSegn.fn }}" host-role="tab" host-aria-selected="{{ tSegn.on }}"></dc-import><dc-import name="UI Chip" label="Storico revisioni" tone="{{ tStorico.tone }}" size="sm" on-click="{{ tStorico.fn }}" host-role="tab" host-aria-selected="{{ tStorico.on }}"></dc-import></div>
<sc-if value="{{ isProfilo }}"><div class="r-grid-1" style="background:#FFFFFF;border-radius:24px;padding:4px 20px;display:grid;grid-template-columns:200px 1fr;font-size:14px"><sc-for list="{{ rows }}" as="d"><span style="padding:13px 0;color:#8C84AE;border-top:{{ d.bt }}">{{ d.k }}</span><span style="padding:13px 0;border-top:{{ d.bt }};overflow-wrap:anywhere;white-space:pre-line">{{ d.v }}</span></sc-for></div></sc-if>
<sc-if value="{{ isAttivita }}"><div style="background:#FFFFFF;border-radius:24px;padding:4px 20px;font-size:14px"><sc-for list="{{ prefs }}" as="h"><div style="display:flex;flex-direction:column;gap:2px;padding:12px 0;border-top:{{ h.bt }}"><span>{{ h.t }}</span><span style="font-family:'Geist Mono',monospace;font-size:11px;color:#8C84AE">{{ h.d }}</span></div></sc-for><sc-if value="{{ noPrefs }}"><span style="display:block;padding:14px 0;color:#8C84AE">Nessuna scelta facoltativa registrata.</span></sc-if></div></sc-if>
<sc-if value="{{ isSegn }}"><div style="background:#FFFFFF;border-radius:24px;padding:4px 20px;font-size:14px"><sc-for list="{{ reports }}" as="r"><div style="display:flex;flex-direction:column;gap:2px;padding:12px 0;border-top:{{ r.bt }}"><span style="font-weight:600">{{ r.t }}</span><span style="color:#4A4560">{{ r.d }}</span><span style="font-family:'Geist Mono',monospace;font-size:11px;color:#8C84AE">{{ r.m }}</span></div></sc-for><sc-if value="{{ noReports }}"><span style="display:block;padding:14px 0;color:#8C84AE">Nessuna segnalazione.</span></sc-if></div></sc-if>
<sc-if value="{{ isStorico }}"><div style="background:#FFFFFF;border-radius:24px;padding:4px 20px;font-size:14px"><sc-for list="{{ reviews }}" as="r"><div style="display:flex;flex-direction:column;gap:2px;padding:12px 0;border-top:{{ r.bt }}"><span style="font-weight:600">{{ r.t }}</span><sc-if value="{{ r.d }}"><span style="color:#4A4560">“{{ r.d }}”</span></sc-if><span style="font-family:'Geist Mono',monospace;font-size:11px;color:#8C84AE">{{ r.m }}</span></div></sc-for><sc-if value="{{ noReviews }}"><span style="display:block;padding:14px 0;color:#8C84AE">Nessuna revisione.</span></sc-if></div></sc-if>
</div>
<div style="display:flex;flex-direction:column;gap:12px;padding-top:34px">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><sc-for list="{{ stats }}" as="x"><dc-import name="UI Stat" label="{{ x.l }}" value="{{ x.v }}" delta=""></dc-import></sc-for></div>
<div style="background:#FFFFFF;border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:10px"><span style="font-size:13px;font-weight:600">Note admin</span>
<sc-for list="{{ notes }}" as="n"><div style="display:flex;flex-direction:column;gap:3px;font-size:14px"><span style="white-space:pre-line">{{ n.b }}</span><span style="font-size:11px;color:#8C84AE;font-family:'Geist Mono',monospace">{{ n.m }}</span></div></sc-for>
<dc-import name="App Field" rows="2" field="admin-note" value="{{ note }}" placeholder="Nota interna, non visibile all'utente" dc-props="{{ noteProps }}"></dc-import>
<div style="display:flex;justify-content:flex-end"><dc-import name="UI Button" label="Aggiungi nota" variant="secondary" size="sm" on-click="{{ addNote }}"></dc-import></div></div>
<div style="background:#FFFFFF;border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:8px">
<dc-import name="App Field" label="Nota per l'utente" rows="2" field="user-note" value="{{ userNote }}" placeholder="Obbligatoria per richiedere modifiche o rifiutare" dc-props="{{ userNoteProps }}"></dc-import>
<sc-if value="{{ canApprove }}"><dc-import name="UI Button" label="{{ approveLabel }}" variant="accent" full="{{ true }}" on-click="{{ approve }}"></dc-import></sc-if>
<sc-if value="{{ canView }}"><dc-import name="UI Button" label="Vedi come lo vedono i membri" variant="light" full="{{ true }}" on-click="{{ viewAsMember }}"></dc-import></sc-if>
<sc-if value="{{ canChanges }}"><dc-import name="UI Button" label="Richiedi modifiche" variant="light" full="{{ true }}" on-click="{{ changes }}"></dc-import></sc-if>
<sc-if value="{{ canReject }}"><dc-import name="UI Button" label="Rifiuta" variant="light" full="{{ true }}" on-click="{{ reject }}"></dc-import></sc-if>
<sc-if value="{{ canSuspend }}"><dc-import name="UI Button" label="Sospendi account" variant="danger" full="{{ true }}" on-click="{{ suspend }}"></dc-import></sc-if>
<sc-if value="{{ canUnsuspend }}"><dc-import name="UI Button" label="Riattiva account" variant="secondary" full="{{ true }}" on-click="{{ unsuspend }}"></dc-import></sc-if>
</div>
</div></div>
</sc-if>
</main></div>
