<!-- Settings · security: active sessions (from design/Rientro 05 · 38a, the "Sicurezza" block). -->
<div style="min-height:100vh;background:#E9E6F5">
<dc-import name="App Nav" active="none" me="{{ me }}"></dc-import>
<div class="r-grid-1" style="display:grid;grid-template-columns:230px minmax(0,1fr);gap:28px;padding:28px var(--gutter) 40px;box-sizing:border-box">
<div class="r-hide-sm"><dc-import name="App Side Menu" title="Impostazioni" items="{{ menu }}" active="Sicurezza"></dc-import></div>
<main style="display:flex;flex-direction:column;gap:18px;max-width:740px;min-width:0">
<a href="/impostazioni" class="r-show-sm" style="font-size:14px;color:#6B6680;text-decoration:none">← Impostazioni</a>
<div style="display:flex;flex-direction:column;gap:8px"><h1 style="margin:0;font-family:'Unbounded',sans-serif;font-size:30px;font-weight:600;letter-spacing:-.05em">Sicurezza</h1><span style="font-size:15px;color:#4A4560;line-height:1.5">I dispositivi da cui hai fatto l’accesso. Se non ne riconosci uno, esci da tutti.</span></div>
<section id="sicurezza" aria-label="Sicurezza" style="background:#FFFFFF;border-radius:28px;padding:18px 24px;display:flex;flex-direction:column;gap:10px">
<div class="r-grid-1" style="display:grid;grid-template-columns:180px 1fr auto;gap:20px;align-items:center"><span style="font-size:14px;color:#6B6680">Sessioni attive</span><span style="display:flex;flex-direction:column;gap:2px"><sc-for list="{{ sessions }}" as="x"><span style="font-size:{{ x.fs }}px;color:{{ x.fg }}">{{ x.l }}</span></sc-for></span><dc-import name="UI Button" label="Esci ovunque" variant="secondary" size="sm" on-click="{{ logoutAll }}"></dc-import></div>
</section>
</main></div>
<dc-import name="App TabBar" active="profilo" me="{{ me }}"></dc-import>
</div>
