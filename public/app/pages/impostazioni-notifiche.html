<!-- Settings · email notifications (from design/Rientro 05 · 38a, the "Notifiche" block). In the app they always arrive. -->
<div style="min-height:100vh;background:#E9E6F5">
<dc-import name="App Nav" active="none" me="{{ me }}"></dc-import>
<div class="r-grid-1" style="display:grid;grid-template-columns:230px minmax(0,1fr);gap:28px;padding:28px var(--gutter) 40px;box-sizing:border-box">
<div class="r-hide-sm"><dc-import name="App Side Menu" title="Impostazioni" items="{{ menu }}" active="Notifiche"></dc-import></div>
<main style="display:flex;flex-direction:column;gap:18px;max-width:740px;min-width:0">
<a href="/impostazioni" class="r-show-sm" style="font-size:14px;color:#6B6680;text-decoration:none">← Impostazioni</a>
<div style="display:flex;flex-direction:column;gap:8px"><h1 style="margin:0;font-family:'Unbounded',sans-serif;font-size:30px;font-weight:600;letter-spacing:-.05em">Notifiche mail</h1><span style="font-size:15px;color:#4A4560;line-height:1.5">Scegli quali avvisi ricevere anche per email.</span></div>
<section id="notifiche" aria-label="Notifiche mail" style="background:#FFFFFF;border-radius:28px;padding:18px 24px">
<div style="display:grid;grid-template-columns:1fr 60px;font-size:14px;margin-top:6px">
<sc-for list="{{ notif }}" as="n"><span style="padding:10px 0;border-top:1px solid #ECE8F7;display:flex;flex-direction:column;gap:2px;justify-content:center">{{ n.t }}<sc-if value="{{ n.hasD }}"><span style="font-size:12px;color:#8C84AE">{{ n.d }}</span></sc-if></span><span style="padding:10px 0;border-top:1px solid #ECE8F7;display:flex;justify-content:center;align-items:center"><dc-import name="UI Checkbox" label="" checked="{{ n.e }}" on-click="{{ n.toggleE }}" host-role="checkbox" host-aria-checked="{{ n.e }}" host-aria-label="{{ n.eAria }}"></dc-import></span></sc-for>
</div>
<span style="display:block;font-size:12px;color:#8C84AE;margin-top:10px">Ti scriviamo solo se un messaggio o una richiesta resta da leggere per 15 minuti, e mettiamo tutto in un’unica email.</span></section>
</main></div>
<dc-import name="App TabBar" active="profilo" me="{{ me }}"></dc-import>
</div>
