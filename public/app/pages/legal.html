<!-- From design/Rientro 05 Account e Privacy v2 · artboard 43b (privacy policy · riassunto prima del testo). -->
<div style="min-height:100vh;background:#E9E6F5">
<header style="padding:18px var(--gutter) 0"><div style="min-height:60px;padding:6px 10px 6px 26px;box-sizing:border-box;border-radius:32px;background:rgba(255,255,255,.72);border:1px solid #FFFFFF;display:flex;align-items:center;gap:4px;font-size:14px;font-weight:500;flex-wrap:wrap"><a href="/" aria-label="Rientro, home" style="text-decoration:none"><dc-import name="UI Logo" size="26"></dc-import></a><div style="flex:1"></div><nav aria-label="Documenti" style="display:flex;flex-wrap:wrap"><sc-for list="{{ tabs }}" as="t"><a href="{{ t.href }}" aria-current="{{ t.cur }}" style="padding:9px 16px;border-radius:999px;background:{{ t.bg }};color:{{ t.fg }};text-decoration:none">{{ t.l }}</a></sc-for></nav></div></header>
<div class="r-grid-1" style="display:grid;grid-template-columns:230px minmax(0,1fr);gap:28px;padding:32px var(--gutter) 48px;box-sizing:border-box">
<nav aria-label="Indice" class="r-hide-sm" style="position:sticky;top:calc(24px + var(--lb, 0px));align-self:start;font-size:14px"><dc-import name="App Toc" eyebrow="Indice" dc-props="{{ tocProps }}"></dc-import></nav>
<main style="display:flex;flex-direction:column;gap:24px;max-width:700px;min-width:0">

<div style="display:flex;flex-direction:column;gap:8px"><h1 class="r-h2" style="margin:0;font-family:'Unbounded',sans-serif;font-size:40px;font-weight:600;letter-spacing:-.055em">{{ title }}</h1><span style="font-family:'Geist Mono',monospace;font-size:11px;color:#8C84AE">{{ updated }}</span></div>
<section id="in-breve" aria-label="In breve" class="r-grid-1" style="background:#FFFFFF;border-radius:28px;padding:26px;display:grid;grid-template-columns:1fr 1fr;gap:22px"><sc-for list="{{ summary }}" as="s"><div class="sum-item"><span class="sum-dot" aria-hidden="true"></span><div style="display:flex;flex-direction:column;gap:6px"><span style="font-weight:600">{{ s.t }}</span><span style="font-size:14px;color:#6B6680;line-height:1.5">{{ s.d }}</span></div></div></sc-for></section>
<sc-for list="{{ sections }}" as="x"><section id="{{ x.id }}" style="display:flex;flex-direction:column;gap:12px"><h2 style="margin:0;font-family:'Unbounded',sans-serif;font-size:18px;font-weight:600;letter-spacing:-.03em">{{ x.t }}</h2><sc-for list="{{ x.ps }}" as="p"><p class="{{ p.cls }}">{{ p.p }}</p></sc-for>
<sc-if value="{{ x.isPurposes }}"><div style="display:flex;flex-direction:column;gap:10px"><sc-for list="{{ purposes }}" as="r"><div class="legal-card"><span class="legal-card-t">{{ r.t }}</span><div class="legal-card-grid"><span class="legal-card-k">Cosa facciamo</span><span>{{ r.what }}</span><span class="legal-card-k">Dati</span><span>{{ r.data }}</span><span class="legal-card-k">Base giuridica</span><span>{{ r.basis }}</span></div></div></sc-for></div></sc-if>
</section></sc-for>
</main></div>
</div>
